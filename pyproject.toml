[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="wild-pose-matching"
version="0.1.0"
requires-python=">=3.10"
dependencies=["numpy>=1.24","torch>=2.1","scikit-learn>=1.3","sentence-transformers>=2.2"]
[project.scripts]
gestureclr="wild_pose_matching.cli:main"
[tool.setuptools.packages.find]
where=["src"]


[project.optional-dependencies]
speech = ["kokoro>=0.9.4", "soundfile>=0.12", "faster-whisper>=1.1"]
